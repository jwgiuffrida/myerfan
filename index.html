<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Erfan</title>
<style>
:root{--bg:#cfd9e6;--fg:#14202e;--mut:#4b5b6d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--fg:#e6ebf2;--mut:#9aa7b8}}
:root[data-theme="dark"]{--bg:#10151c;--fg:#e6ebf2;--mut:#9aa7b8}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:13px Tahoma,"Segoe UI",Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;box-sizing:border-box}
.note{color:var(--mut);font-size:12px;margin:0}
.win{width:100%;max-width:620px;background:#fff;color:#000;border:1px solid #3b4a5e;border-radius:6px 6px 0 0;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.win.intro{max-width:470px}
.tb{display:flex;align-items:center;gap:6px;padding:5px 8px;background:linear-gradient(#e6f0fb,#b5cbe8);font-size:12px;border-radius:5px 5px 0 0}
.tb img{width:16px;height:16px}
.cl{position:relative;padding:0 0 12px}
button{font:inherit;color:#000;background:linear-gradient(#f6f6f6 45%,#dedede 50%,#cfcfcf);border:1px solid #707070;border-radius:3px;padding:3px 8px;cursor:pointer;min-height:24px}
button:hover:not(:disabled){border-color:#3c7fb1;background:linear-gradient(#eaf6fd 45%,#bee6fd 50%,#a7d9f5)}
button:disabled{color:#838383;border-color:#adb2b5;background:#f4f4f4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid #3c7fb1;outline-offset:1px}
.go{background:#c0ffc0;font-weight:700}.bad{background:#ffc0c0;font-weight:700}
#intro img.h{display:block;width:100%;height:30px}
#intro .b{padding:0 16px}
#intro p{font-weight:700;font-size:13px;margin:14px 0 0}
#intro .row{display:flex;gap:10px;margin-top:14px}
#intro input{flex:1;min-width:0;font:inherit;padding:3px;border:1px solid #7a7a7a}
.bar{height:17px;background:#ffffc0;margin:18px 0 -12px;position:relative}
#bAbout{position:absolute;right:6px;top:0;width:19px;min-height:17px;padding:0;font-size:11px}
.hd{text-align:center;font-size:17px;font-weight:400;margin:10px 0}
#game{padding:0 12px}
.top{display:flex;flex-wrap:wrap;gap:14px}
.lw{flex:1;min-width:240px;position:relative;height:170px}
#log{height:100%;box-sizing:border-box;overflow:auto;white-space:pre-wrap;border:1px solid #7a7a7a;padding:4px;font-size:12px}
#log.b{font-weight:700}
.side{width:112px;margin:0 auto;text-align:center}
.pt{position:relative;width:104px;height:102px;margin:0 auto 6px}
.pt img{position:absolute}
#face{inset:0;width:100%;height:100%}
#hat1{left:16.5%;top:-21%;width:82.5%;height:82%}
#hat2{left:12.4%;top:-59.7%;width:66%;height:99%}
#hat3{left:6.2%;top:4.2%;width:82.5%;height:82%}
.pt img[hidden]{display:none}
.side b{display:block;margin:2px 0 8px}
.sb{display:flex;gap:6px;justify-content:center}.sb button{padding:1px 6px;min-height:20px;font-size:12px}
#hot{width:34px;height:26px;margin:8px 0 0 auto}
.ov{position:absolute;inset:0;background:#fff;border:1px solid #7a7a7a;padding:6px 10px;overflow:hidden;box-sizing:border-box}
.ov[hidden],#st[hidden]{display:none}
.lg{position:absolute;top:-1px;left:8px;background:#fff;padding:0 3px;transform:translateY(-50%);font-size:12px}
.ov.blk{background:#000;color:#fff;padding:0;border-color:#000}.ov.blk .lg{background:#000;color:#fff;top:8px;left:6px;transform:none}
.ov.blk img{position:absolute;left:6px;right:6px;top:26px;width:calc(100% - 12px);height:calc(100% - 32px)}
.ov.blk button{position:absolute;bottom:10px;right:14px}
#win2 button{right:auto;left:14px}
.cap{font-weight:700;margin:14px 0 8px}
.q{margin-bottom:8px}.q b{display:block;margin-bottom:3px}
.q div{display:flex;flex-wrap:wrap;gap:4px 14px}.q label{white-space:nowrap}
.res{white-space:pre-wrap;font-weight:700;margin-top:14px}
.ov>button{position:absolute;right:10px;bottom:8px}
#st{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:#fff;padding:2px 4px}
#st span{color:#008000;font-weight:700}
.store label{display:flex;align-items:center;gap:8px;margin:7px 0}.store img{width:24px;height:30px;object-fit:fill}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;margin:14px 0 12px}
.stats span{display:flex;align-items:center;gap:5px}.stats img{width:24px;height:24px}
.stats i{font-style:normal;min-width:2.2em;text-align:center}
.acts{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-template-columns:repeat(var(--c,3),1fr);gap:8px 12px}
.acts button{min-height:28px}.acts button[hidden]{display:none}
#god{position:absolute;right:20px;bottom:90px;background:#f0f0f0;border:1px solid #777;padding:4px;display:grid;grid-template-columns:repeat(3,30px);gap:3px}
#god[hidden]{display:none}#god button{padding:0;min-height:22px;font-size:11px}
dialog{border:1px solid #3b4a5e;padding:0;color:#000;background:#fff;max-width:340px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dt{background:linear-gradient(#e6f0fb,#b5cbe8);padding:5px 8px;font-size:12px}
.db{display:flex;gap:12px;padding:18px 16px;align-items:flex-start}.db img{width:32px;height:32px}
.db .x{flex:none;width:30px;height:30px;border-radius:50%;background:#c42b1c;color:#fff;font-weight:700;text-align:center;line-height:30px}
.db p{margin:0}.df{background:#f0f0f0;padding:10px;text-align:right}.df button{min-width:74px}
</style></head><body>
<div class="win intro" id="win">
 <div class="tb"><img data-img="about" alt=""><span id="ttl">My Erfan</span></div>
 <div class="cl">
  <section id="intro">
   <img class="h" data-img="head" alt="My Erfan">
   <div class="b"><p>Welcome to My Erfan!</p><p>To begin, please enter the name of your Erfan below:</p>
    <div class="row"><input id="nameIn" maxlength="16" autocomplete="off" aria-label="Name of your Erfan"><button id="bGo">Confirm Name</button></div></div>
   <div class="bar"><button id="bAbout" aria-label="About">i</button></div>
  </section>
  <section id="game" hidden>
   <h1 class="hd">My Erfan</h1>
   <div class="top">
    <div class="lw"><div id="log" role="log" tabindex="-1"></div>
     <div id="st"><span>Ready?</span><button id="bStart">Start</button></div></div>
    <aside class="side">
     <div class="pt"><img id="face" data-img="erfan" alt="Erfan"><img id="hat1" data-img="hat1" alt="" hidden><img id="hat2" data-img="hat2" alt="" hidden><img id="hat3" data-img="hat3" alt="" hidden></div>
     <b id="nm"></b>
     <div class="sb"><button id="bStore">Store</button><button id="bExit">Exit</button></div>
     <div id="hot" aria-hidden="true"></div>
    </aside>
   </div>
   <div class="stats">
    <span><img data-img="iq" alt=""><b>IQ:</b><i id="vIQ"></i></span>
    <span><img data-img="health" alt=""><b>Health:</b><i id="vHealth"></i></span>
    <span><img data-img="happiness" alt=""><b>Happiness:</b><i id="vHappy"></i></span>
    <span><img data-img="rial" alt=""><b>Rial:</b><i id="vRial"></i></span>
   </div>
   <div class="acts" id="acts">
    <button data-a="feed" class="act">Feed</button><button data-a="treat" class="act">Treat</button>
    <button data-a="train" class="act">Train</button><button data-a="compete" class="act">Compete</button>
    <button data-a="pet" class="act">Pet</button><button data-a="play" class="act">Play</button>
    <button data-a="space" class="go" hidden>Space</button><button data-a="nuclear" class="go" hidden>Nuclear</button>
    <button data-a="deport" class="bad" hidden>Deport</button><button data-a="shoot" class="bad" hidden>Shoot</button>
   </div>
   <div id="god" hidden><button data-g="h">:)</button><button data-g="H">+H</button><button data-g="I">+I</button><button data-g="C">+C</button><button data-g="R">+R</button><button data-g="m">-H</button></div>
  </section>
 </div>
</div>
<p class="note">A web port of the 2013 Visual Basic 6 original by Joel Giuffrida.</p>

<dialog id="abt"><div class="db"><img data-img="about" alt=""><div><div style="font-size:15px">My Erfan</div><p style="margin-top:8px">Version: BETA 1.0.0</p><p style="margin-top:14px">Created by Joel Giuffrida</p></div></div><div class="df"><button id="aok">OK</button></div></dialog>

const wear=h=>[1,2,3].forEach(i=>$('hat'+i).hidden=i!==h);
function render(){
 $('vIQ').textContent=S.iq;$('vHealth').textContent=S.health;$('vHappy').textContent=S.happiness;$('vRial').textContent=S.rial;
 $('vHealth').style.color=S.health<20?'red':'';$('vHappy').style.color=S.happiness<20?'red':'';
}
function sync(){document.querySelectorAll('.act').forEach(b=>b.disabled=S.paused);$('bStore').disabled=S.paused||S.lock}
function pauseGame(p){S.paused=p;clearInterval(T.r);if(!p)T.r=setInterval(reduce,10000);sync()}
function reduce(){S.hunger++;S.boredom++;if(S.hunger>=3||S.boredom>=3){S.health-=5;S.happiness-=10}}
function tick(){
 if(!S||!S.statsOn)return;render();
 if(S.competed===2){cols(4);document.querySelector('[data-a=space]').hidden=document.querySelector('[data-a=nuclear]').hidden=false;
  say("It's time to choose your fate, "+S.name+'.');S.statsOn=false;pauseGame(true)}
 if(S.health<=0){ov('lose3');pauseGame(true)}
 if(S.happiness<=0){say(S.name+" has given up all hope. It's time to choose his fate.");S.statsOn=false;cols(4);
  document.querySelector('[data-a=deport]').hidden=document.querySelector('[data-a=shoot]').hidden=false;pauseGame(true)}
 if(S.gameover)leave();
}
function leave(){clearInterval(T.r);clearInterval(T.s);clearTimeout(T.q);S=null;
 $('win').className='win intro';$('ttl').textContent='My Erfan';$('intro').hidden=false;$('game').hidden=true;$('nameIn').value='';$('nameIn').focus()}
function begin(name){
 S={name,iq:0,rial:25,health:100,happiness:100,hunger:0,boredom:0,pet:0,play:0,competed:0,paused:true,lock:false,gameover:false,statsOn:true,owned:{},admin:name==='007'};
 $('win').className='win game';$('ttl').textContent='My Erfan - '+name;$('intro').hidden=true;$('game').hidden=false;
 $('nm').textContent="'"+name+"'";$('log').textContent='';$('log').className='b';
 ov(null);wear(0);$('r3').hidden=true;$('god').hidden=true;cols(3);
 document.querySelectorAll('[data-a=space],[data-a=nuclear],[data-a=deport],[data-a=shoot]').forEach(b=>b.hidden=true);
 say('','Welcome to My Erfan, '+name+'.','','The objective of the game is to both nuture and direct '+name+' towards greater things.','','Maintain his basic needs, improve his IQ and compete your very own Erfan in competitions which can earn both respect, and rial which can be spent in the My Erfan store.');
 $('st').hidden=false;pauseGame(true);render();clearInterval(T.s);T.s=setInterval(tick,100);
}
function quiz(k){const z=QZ[k];S.lock=true;sync();say('You have been entered into the '+z.t+'.');
 $(k+'Cap').textContent='Welcome to the '+z.t+', '+S.name+'!';$(k).querySelectorAll('input').forEach(i=>i.checked=false);
 $(k+'Cap').hidden=false;[k+'Q',k+'Res',k+'Sub',k+'Fin'].forEach(i=>$(i).hidden=true);ov(k);
 clearTimeout(T.q);T.q=setTimeout(()=>{$(k+'Cap').textContent=z.q1;$(k+'Q').hidden=false;$(k+'Sub').hidden=false},3250)}
function submit(k){const z=QZ[k],n=S.name,v=x=>(document.querySelector(`input[name=${k+x}]:checked`)||{}).value;
 const ok=v(1)==z.a1&&v(2)==z.a2;
 $(k+'Res').textContent=ok?`Congratulations ${n}! \nYou have successfully completed the ${z.t}.\nYou are one step closer to joining the Iranian Space Programme!`
  :`Comiserations ${n}! Unfortunately, you ${k=='pub'?'were unable to correctly answer the Iranian Pub Quiz questions.':'did not complete the Iranian Space Challenge successfully.'}\n\nBe sure to try again soon!`;
 if(ok){S.rial+=z.rial;if(k=='pub')S.competed=1}S.iq=0;
 $(k+'Cap').hidden=true;$(k+'Q').hidden=true;$(k+'Sub').hidden=true;$(k+'Res').hidden=false;$(k+'Fin').hidden=false;clearTimeout(T.q)}
function finish(k){const z=QZ[k];ov(null);S.lock=false;if(k=='space')S.competed=2;sync();
 say(`Congratulations ${S.name}! You have successfully completed the ${z.t}.`,S.name+': YES!')}
const A={
 feed(){if(S.rial<5)return msg('You do not have enough rial to buy this food.','Insufficent Rial');if(S.health===100)return;
  S.health+=3;S.rial=Math.max(0,S.rial-5);say('You have fed '+S.name,'--- +3 Health Points ---');
  if(S.health>=100){S.health=100;say('--- You have overfed '+S.name+" and now he's overweight. Shame on you! ---")}},
 treat(){if(S.rial<3)return msg('You do not have enough rial to buy this food.','Insufficent Rial');if(S.health===100)return;
  S.health=Math.min(100,S.health+2);S.rial=Math.max(0,S.rial-3);say('You have treated '+S.name+' to some chicken and chips, good choice!','--- +2 Health Points ---')},
 train(){if(S.iq===100)return;S.iq=Math.min(100,Math.max(0,S.iq+5));S.happiness-=5;say('You have sent '+S.name+' to the silent room, well done!','--- +5 IQ Points ---')},
 pet(){if(S.happiness===100)return;S.pet++;S.happiness=Math.min(100,S.happiness+2);say('You have petted '+S.name,'--- +2 Happiness Points ---');if(S.pet===5)say(S.name+': FUCK OFF!')},
 play(){if(S.happiness===100)return;S.play++;S.happiness=Math.min(100,S.happiness+4);say('You have played Pocket Soccer. You have made '+S.name+' very happy!','--- +4 Happiness Points ---');if(S.play===5)say(S.name+': POCKET SOCCER!?!')},
 compete(){hideFrames();if(S.iq<80)return say('You have attempted to compete in a competition, but '+S.name+' lacks the IQ required!',S.name+': Oh for fuck sake!');
  if(S.competed===0)quiz('pub');else if(S.competed===1)quiz('space')},
 space(){ov('win1');S.owned[3]=1;$('r3').hidden=false;wear(3)},
 nuclear(){ov('win2')},deport(){ov('lose1')},shoot(){ov('lose2')}};
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{A[b.dataset.a]();render()});
$('bStore').onclick=()=>{hideFrames();ov('store')};
$('bSx').onclick=()=>$('store').hidden=true;
$('bBuy').onclick=()=>{const h=[1,2,3].find(i=>$('oh'+i).checked);if(!h)return;
 if(S.owned[h])wear(h);else if(PRICE[h]>S.rial)msg("You can't afford that item. Damn it Erfan!",'Insufficent Rial');
 else{S.rial-=PRICE[h];S.owned[h]=1;wear(h);say('You have bought '+S.name+' a new hat. He loves it!',S.name+': '+(h===1?'Fuck aye.':"Top o' the morning!"));}render()};
$('bStart').onclick=()=>{$('log').className='';$('log').textContent='';$('st').hidden=true;pauseGame(false)};
$('bExit').onclick=leave;
// admin menu (name "007", click the invisible spot under Store/Exit)
$('hot').onclick=()=>{if(S&&S.admin)$('god').hidden=false};
$('god').onclick=e=>{const g=e.target.dataset.g;if(!g){$('god').hidden=true;return}
 if(g=='h')S.happiness+=100;if(g=='H')S.health+=100;if(g=='I')S.iq+=100;if(g=='R')S.rial+=100;if(g=='C')S.competed=2;if(g=='m'){S.hunger=3;S.health-=95}render()};
// intro
const proper=s=>s.toLowerCase().replace(/(^|[^\p{L}\p{N}])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
$('nameIn').oninput=e=>{e.target.value=proper(e.target.value)};
const go=()=>{const n=$('nameIn').value;if(n==='')msg('Please enter a name for your Erfan in the textbox provided.','Name Required');else begin(n)};
$('bGo').onclick=go;$('nameIn').onkeydown=e=>{if(e.key==='Enter')go()};
$('bAbout').onclick=()=>$('abt').showModal();$('aok').onclick=()=>$('abt').close();$('dok').onclick=()=>$('dlg').close();
$('nameIn').focus();
</script></body></html>
